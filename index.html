<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics Bridge</title>
<style>
  :root { --bg:#121212; --card:#1e1e1e; --fg:#eee; --dim:#999; --accent:#1db954; --bad:#e5534b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:16px; max-width:520px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:0 0 12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:.85rem; color:var(--dim); margin-bottom:4px; }
  input[type=text] { width:100%; padding:10px; border-radius:8px; border:1px solid #333; background:#111; color:var(--fg); font-size:1rem; }
  button { background:var(--accent); color:#000; border:0; border-radius:999px; padding:10px 18px; font-weight:600; font-size:1rem; margin:8px 8px 0 0; }
  button.secondary { background:#333; color:var(--fg); }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); display:inline-block; }
  .dot.on { background:var(--accent); }
  #now { font-weight:600; }
  #artist { color:var(--dim); }
  #lyric { font-size:1.2rem; min-height:3em; margin-top:10px; }
  #log { font-family: ui-monospace, monospace; font-size:.75rem; color:var(--dim); max-height:140px; overflow:auto; white-space:pre-wrap; }
  .small { font-size:.8rem; color:var(--dim); }
</style>
</head>
<body>
<h1>Spotify → OLED Lyrics Bridge</h1>

<div class="card">
  <label for="clientId">Spotify Client ID</label>
  <input id="clientId" type="text" placeholder="paste from developer.spotify.com/dashboard" autocomplete="off">
  <div class="small" style="margin-top:6px">Redirect URI to register in your Spotify app: <code id="redir"></code></div>
  <div class="row">
    <button id="loginBtn">Log in to Spotify</button>
    <span><span id="spDot" class="dot"></span> Spotify</span>
  </div>
</div>

<div class="card">
  <div class="row">
    <button id="bleBtn">Connect display</button>
    <button id="testBtn" class="secondary">Test display</button>
    <button id="viewBtn" class="secondary">Switch view</button>
    <span><span id="bleDot" class="dot"></span> <span id="bleName">BLE</span></span>
  </div>
  <label style="margin-top:10px"><input type="checkbox" id="autoCover"> Also show the cover for a few seconds when a song starts (in lyrics view)</label>
  <label for="offset" style="margin-top:10px">Lyric offset: <span id="offVal">200</span> ms early</label>
  <input id="offset" type="range" min="-1000" max="1500" step="50" value="200" style="width:100%">
</div>

<div class="card">
  <div id="now">Nothing playing</div>
  <div id="artist"></div>
  <div id="lyric"></div>
</div>

<div class="card"><div id="log"></div></div>

<script>
// ================= config =================
const SCOPES = 'user-read-currently-playing user-read-playback-state';
const REDIRECT_URI = location.origin + location.pathname;
const POLL_MS = 3000;        // Spotify poll interval
const TICK_MS = 100;         // lyric sync tick
const KEEPALIVE_MS = 10000;  // Arduino drops to idle after 60 s of silence

const $ = id => document.getElementById(id);
$('redir').textContent = REDIRECT_URI;
const log = m => { const el = $('log'); el.textContent = `${new Date().toLocaleTimeString()} ${m}\n` + el.textContent.slice(0, 4000); };

// Small storage wrapper (tokens + client id survive a reload)
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
$('clientId').value = store.get('clientId') || '';
$('clientId').onchange = e => store.set('clientId', e.target.value.trim());

let offsetMs = +(store.get('offset') ?? 200);
$('offset').value = offsetMs; $('offVal').textContent = offsetMs;
$('offset').oninput = e => { offsetMs = +e.target.value; $('offVal').textContent = offsetMs; store.set('offset', offsetMs); };

// ================= Spotify auth (PKCE) =================
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function login() {
  const clientId = $('clientId').value.trim();
  if (!clientId) return alert('Paste your Spotify Client ID first.');
  store.set('clientId', clientId);
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  store.set('pkce_verifier', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({
    client_id: clientId, response_type: 'code', redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES,
  });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}

async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: store.get('clientId'), ...params }),
  });
  if (!r.ok) throw new Error('token ' + r.status + ' ' + await r.text());
  const t = await r.json();
  store.set('access_token', t.access_token);
  if (t.refresh_token) store.set('refresh_token', t.refresh_token);
  store.set('expires_at', Date.now() + (t.expires_in - 60) * 1000);
}

async function handleRedirect() {
  const code = new URLSearchParams(location.search).get('code');
  if (!code) return;
  history.replaceState({}, '', REDIRECT_URI);
  await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: store.get('pkce_verifier') });
  log('Spotify login OK');
}

async function accessToken() {
  if (!store.get('access_token')) return null;
  if (Date.now() > +store.get('expires_at')) {
    await tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('refresh_token') });
  }
  return store.get('access_token');
}

// ================= BLE (HM-10: service FFE0, characteristic FFE1) =================
let bleChar = null, bleDevice = null, writeChain = Promise.resolve();
let withResponse = false;     // acknowledged writes = built-in flow control, if the module supports it
const listening = new WeakSet();
let rxBuf = '';
// Messages from the Arduino. "B" = push button pressed.
function onBleData(e) {
  rxBuf += new TextDecoder().decode(e.target.value);
  let nl;
  while ((nl = rxBuf.indexOf('\n')) >= 0) {
    const msg = rxBuf.slice(0, nl).trim();
    rxBuf = rxBuf.slice(nl + 1);
    if (msg === 'B') { log('Button pressed'); toggleView(); }
  }
  if (rxBuf.length > 64) rxBuf = '';
}
let connecting = false, userDisconnected = false, drops = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function connectBle() {
  try {
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [0xFFE0] }, { namePrefix: 'HM' }, { namePrefix: 'BT05' }, { namePrefix: 'MLT' }, { namePrefix: 'DSD' }],
      optionalServices: [0xFFE0],
    });
    if (bleDevice && bleDevice !== dev) {
      bleDevice.removeEventListener('gattserverdisconnected', onBleDisconnect);
      try { bleDevice.gatt.disconnect(); } catch {}
    }
    if (bleDevice !== dev) dev.addEventListener('gattserverdisconnected', onBleDisconnect); // only once per device
    bleDevice = dev;
    userDisconnected = false;
    await gattConnect();
  } catch (e) { log('BLE: ' + e.message); }
}

async function gattConnect() {
  if (connecting) return;
  connecting = true;
  try {
    const server = bleDevice.gatt.connected ? bleDevice.gatt : await bleDevice.gatt.connect();
    const svc = await server.getPrimaryService(0xFFE0);
    const ch = await svc.getCharacteristic(0xFFE1);
    withResponse = !!ch.properties.write;
    if (!listening.has(ch)) {
      try {
        await ch.startNotifications();
        ch.addEventListener('characteristicvaluechanged', onBleData);
        listening.add(ch);
      } catch (e) { log('Push button won\'t work (no notifications): ' + e.message); }
    }
    bleChar = ch;
    $('bleDot').classList.add('on'); $('bleName').textContent = bleDevice.name || 'Display';
    log(`BLE connected (${withResponse ? 'acknowledged' : 'paced'} writes)`);
    await sleep(300);           // let the module settle before the first burst
    resendAll();
  } finally { connecting = false; }
}

// Reconnect for as long as it takes, backing off up to 10 s between tries.
async function onBleDisconnect() {
  bleChar = null; $('bleDot').classList.remove('on');
  writeChain = Promise.resolve();   // drop anything queued for the old link
  if (userDisconnected) return;
  drops++;
  log(`BLE dropped (${drops} so far), reconnecting…`);
  for (let i = 0, wait = 1000; !bleChar && !userDisconnected; i++, wait = Math.min(wait * 1.5, 10000)) {
    await sleep(wait);
    try { await gattConnect(); } catch (e) { if (i % 5 === 4) log('Still reconnecting: ' + e.message); }
  }
}

// The OLED font is ASCII only: strip accents, map smart punctuation, drop the rest.
function toAscii(s) {
  return (s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[‘’ʼ]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...')
    .replace(/[^\x20-\x7E]/g, '?');
}

// Serialize writes; HM-10 takes 20-byte chunks and the Uno's SoftwareSerial is slow.
// stillWanted() is checked just before sending, so stale lyric frames get skipped.
// Pacing keeps below the module's 9600 baud (960 bytes/s) so its buffer never overflows;
// cheap HM-10 clones crash and drop the link when flooded.
const CHUNK_GAP_MS = 30;      // ~650 bytes/s
let sendRate = 650;           // measured bytes/s, used to start Tamil pictures early enough
function enqueue(bytes, stillWanted = () => true) {
  writeChain = writeChain.then(async () => {
    if (!bleChar || !stillWanted()) return;
    const ch = bleChar, t0 = performance.now();
    try {
      for (let i = 0; i < bytes.length; i += 20) {
        if (ch !== bleChar) return;             // link dropped mid-message
        const part = bytes.slice(i, i + 20);
        if (withResponse) await ch.writeValueWithResponse(part);
        else await ch.writeValueWithoutResponse(part);
        await sleep(CHUNK_GAP_MS);
      }
      if (bytes.length > 100) {
        sendRate = 0.7 * sendRate + 0.3 * (bytes.length / ((performance.now() - t0) / 1000));
        await sleep(100);                       // let the Uno finish drawing the picture
      }
    } catch (e) { log('write: ' + e.message); }
  }).catch(() => {});
}

function send(type, text) {
  enqueue(new TextEncoder().encode(`${type}:${toAscii(text).slice(0, 120)}\n`));
}

// ================= Tamil / non-Latin text → bitmap =================
// The Uno's font is English-only, so text in other scripts (Tamil, etc.) is drawn
// here with the phone's own fonts and sent as raw pixels.
const SCRIPT_FONT = '"Noto Sans Tamil","Nirmala UI","Latha","Tamil Sangam MN",sans-serif';
// A lyric picture is ~770 bytes, so start sending it early (based on the measured speed)
const bitmapLeadMs = () => Math.min(2500, 800 * 1000 / sendRate + 150);
const needsBitmap = s => /[^\x00-\x7FÀ-ɏ‘-…]/.test(s || '');

const work = document.createElement('canvas');
work.width = 128; work.height = 64;
const wctx = work.getContext('2d', { willReadFrequently: true });

const graphemes = s => window.Intl?.Segmenter
  ? [...new Intl.Segmenter().segment(s)].map(g => g.segment) : Array.from(s);

// Splits a word that's too wide for the line into grapheme chunks.
function splitWord(w, maxW) {
  if (wctx.measureText(w).width <= maxW) return [w];
  const out = []; let cur = '';
  for (const g of graphemes(w)) {
    if (cur && wctx.measureText(cur + g).width > maxW) { out.push(cur); cur = g; } else cur += g;
  }
  if (cur) out.push(cur);
  return out;
}

function wrapLines(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean).flatMap(w => splitWord(w, maxW)), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (!cur || wctx.measureText(t).width <= maxW) cur = t;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function ellipsize(line, maxW) {
  if (wctx.measureText(line).width <= maxW) return line;
  const g = graphemes(line);
  while (g.length > 1 && wctx.measureText(g.join('') + '…').width > maxW) g.pop();
  return g.join('') + '…';
}

// Largest font size (maxPx..minPx) at which the text fits in a 128 x h box.
// If it doesn't fit even at minPx, it's cut with "…" (used for the header).
function fitText(text, h, maxPx, minPx, w = 128) {
  const pages = paginate(text, h, maxPx, minPx, w);
  if (pages.length === 1) return pages[0];
  const f = pages[0];
  f.lines[f.lines.length - 1] = ellipsize(f.lines[f.lines.length - 1] + '…', w - 2);
  return f;
}

// Same, but text too long for one screen is split into several screens.
function paginate(text, h, maxPx, minPx, w = 128) {
  for (let px = maxPx; px >= minPx; px--) {
    wctx.font = `bold ${px}px ${SCRIPT_FONT}`;
    const lh = Math.ceil(px * 1.2);
    const lines = wrapLines(text, w - 2);
    if (lines.length * lh <= h && lines.every(l => wctx.measureText(l).width <= w)) return [{ px, lh, lines }];
  }
  wctx.font = `bold ${minPx}px ${SCRIPT_FONT}`;
  const lh = Math.ceil(minPx * 1.2), per = Math.max(1, Math.floor(h / lh));
  const lines = wrapLines(text, w - 2).map(l => ellipsize(l, w - 2)), out = [];
  for (let i = 0; i < lines.length; i += per) out.push({ px: minPx, lh, lines: lines.slice(i, i + per) });
  return out;
}

const pageCache = new Map();
function lyricScreens(text) {
  if (!pageCache.has(text)) {
    if (pageCache.size > 300) pageCache.clear();
    pageCache.set(text, paginate(text, 48, 18, 13));
  }
  return pageCache.get(text);
}

function drawFit(fit, y0, h, color, x = 64, align = 'center') {
  wctx.font = `bold ${fit.px}px ${SCRIPT_FONT}`;
  wctx.fillStyle = color; wctx.textAlign = align; wctx.textBaseline = 'middle';
  let y = y0 + (h - fit.lines.length * fit.lh) / 2 + fit.lh / 2;
  for (const l of fit.lines) { wctx.fillText(l, x, Math.round(y)); y += fit.lh; }
}

// ================= Now Playing screen: album cover + title + artist =================
// Cover is shrunk to 64x64 and dithered to black/white dots (Atkinson dithering).
async function loadArt(url) {
  if (!url) return null;
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url;
    await img.decode();
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, 64, 64);
    const d = x.getImageData(0, 0, 64, 64).data, g = new Float32Array(4096);
    for (let i = 0; i < 4096; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    // Stretch contrast (ignore the darkest/brightest 2%) so dim covers still show detail
    const sorted = Array.from(g).sort((a, b) => a - b);
    const lo = sorted[82], hi = Math.max(sorted[4013], lo + 1);
    for (let i = 0; i < 4096; i++) g[i] = Math.min(255, Math.max(0, (g[i] - lo) * 255 / (hi - lo)));
    const bits = new Uint8Array(4096);
    const spread = (xx, yy, e) => { if (xx >= 0 && xx < 64 && yy < 64) g[yy * 64 + xx] += e; };
    for (let y = 0; y < 64; y++) for (let xx = 0; xx < 64; xx++) {
      const i = y * 64 + xx, v = g[i] >= 128 ? 255 : 0, e = (g[i] - v) / 8;
      bits[i] = v ? 1 : 0;
      spread(xx + 1, y, e); spread(xx + 2, y, e);
      spread(xx - 1, y + 1, e); spread(xx, y + 1, e); spread(xx + 1, y + 1, e);
      spread(xx, y + 2, e);
    }
    return bits;
  } catch (e) { log('Album cover: ' + e.message); return null; }
}

function sendCard() {
  if (!current) return;
  wctx.fillStyle = '#000'; wctx.fillRect(0, 0, 128, 64);
  if (current.art) {
    const id = wctx.createImageData(64, 64);
    for (let i = 0; i < 4096; i++) {
      const v = current.art[i] ? 255 : 0;
      id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
    }
    wctx.putImageData(id, 0, 0);
  } else {                                   // no cover: a music-note placeholder
    wctx.strokeStyle = '#fff'; wctx.strokeRect(0.5, 0.5, 63, 63);
    wctx.fillStyle = '#fff'; wctx.font = 'bold 36px sans-serif';
    wctx.textAlign = 'center'; wctx.textBaseline = 'middle'; wctx.fillText('\u266A', 32, 34);
  }
  if (!playing) {                            // pause badge in the cover's corner
    wctx.fillStyle = '#000'; wctx.fillRect(0, 0, 13, 13);
    wctx.fillStyle = '#fff'; wctx.fillRect(3, 2, 3, 9); wctx.fillRect(8, 2, 3, 9);
  }
  // Text column to the right of the cover: song name on top, artist below a divider
  const col = 67, w = 128 - col;
  drawFit(fitText(current.title, 39, 13, 9, w), 0, 39, '#fff', col, 'left');
  wctx.fillStyle = '#fff'; wctx.fillRect(col, 40, w - 2, 1);
  drawFit(fitText(current.artist, 22, 11, 9, w), 42, 22, '#fff', col, 'left');
  view = 'card';
  const seq = ++lyricSeq;
  enqueue(packPages(0, 8), () => seq === lyricSeq);
}

// Pack canvas rows into SSD1306 pages (each byte = 8 vertical pixels, LSB on top).
function packPages(firstPage, pages) {
  const img = wctx.getImageData(0, firstPage * 8, 128, pages * 8).data;
  const out = new Uint8Array(3 + pages * 128);
  out[0] = 0x01; out[1] = firstPage; out[2] = pages;
  for (let p = 0; p < pages; p++)
    for (let x = 0; x < 128; x++) {
      let b = 0;
      for (let bit = 0; bit < 8; bit++) if (img[((p * 8 + bit) * 128 + x) * 4] > 110) b |= 1 << bit;
      out[3 + p * 128 + x] = b;
    }
  return out;
}

// Lyric picture area = pages 2-7 (48 px, 3 lines of Tamil). English stays fast plain text.
// `screen` picks which part of a long line to show (see lyricScreens).
let lyricSeq = 0;
function sendLyric(text, type = 'L', screen = 0) {
  const seq = ++lyricSeq, wanted = () => seq === lyricSeq;
  if (!needsBitmap(text)) {
    enqueue(new TextEncoder().encode(`${type}:${toAscii(text).slice(0, 120)}\n`), wanted);
    return;
  }
  const screens = lyricScreens(text);
  wctx.fillStyle = '#000'; wctx.fillRect(0, 16, 128, 48);
  drawFit(screens[Math.min(screen, screens.length - 1)], 16, 48, '#fff');
  enqueue(packPages(2, 6), wanted);
}

// Header. English: title + artist as text. Tamil etc.: the title drawn in the
// top bar (pages 0-1); there's no room for a readable Tamil artist name too.
function sendHeader() {
  if (!current) return;
  if (!needsBitmap(current.title) && !needsBitmap(current.artist)) {
    send('T', current.title); send('A', current.artist); send('P', playing ? '0' : '1');
    return;
  }
  wctx.fillStyle = '#fff'; wctx.fillRect(0, 0, 128, 16);              // inverted title bar
  drawFit(fitText((playing ? '' : '[II] ') + current.title, 16, 13, 11), 0, 16, '#000');
  enqueue(packPages(0, 2));
}

// ================= Lyrics (LRCLIB, free, no key) =================
function parseLrc(lrc) {
  const out = [];
  for (const raw of lrc.split('\n')) {
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!stamps.length) continue;
    const text = raw.replace(/\[[^\]]*\]/g, '').trim();
    for (const m of stamps) out.push({ t: (+m[1] * 60 + +m[2]) * 1000, text });
  }
  return out.sort((a, b) => a.t - b.t);
}

async function fetchLyrics(track) {
  const artist = track.artists.map(a => a.name)[0];
  const base = 'https://lrclib.net/api/';
  const tries = [
    base + 'get?' + new URLSearchParams({ track_name: track.name, artist_name: artist, album_name: track.album.name, duration: Math.round(track.duration_ms / 1000) }),
    base + 'search?' + new URLSearchParams({ track_name: track.name, artist_name: artist }),
  ];
  for (const url of tries) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      let data = await r.json();
      if (Array.isArray(data)) data = data.find(d => d.syncedLyrics) || data[0];
      if (!data) continue;
      if (data.instrumental) return { status: '(instrumental)' };
      if (data.syncedLyrics) return { lines: parseLrc(data.syncedLyrics) };
      if (data.plainLyrics) return { status: 'Only unsynced lyrics found' };
    } catch (e) { log('lrclib: ' + e.message); }
  }
  return { status: 'No lyrics found' };
}

// ================= State + loops =================
let current = null;            // { id, title, artist, durationMs }
let lyrics = null;             // { lines } or { status }
let progressBase = 0, progressAt = 0, playing = false;
let lastSentIdx = -2;
let view = 'lyrics';           // 'card' = album cover screen, 'lyrics' = header + lyrics
let cardUntil = 0;             // keep the cover up at least until this time
const CARD_MIN_MS = 5000;
let userMode = store.get('viewMode') === 'cover' ? 'cover' : 'lyrics';
const cardEnabled = () => $('autoCover').checked;
$('autoCover').checked = store.get('autoCover') === '1';
$('autoCover').onchange = e => store.set('autoCover', e.target.checked ? '1' : '0');

// Push button / "Switch view": flip between lyrics and the album cover screen.
function toggleView() {
  if (!current) { log('Nothing playing to switch'); return; }
  userMode = view === 'card' ? 'lyrics' : 'cover';
  store.set('viewMode', userMode);
  cardUntil = 0;
  if (userMode === 'cover') sendCard(); else showLyricsView();
  $('viewBtn').textContent = userMode === 'cover' ? 'Show lyrics' : 'Show cover';
}

function showLyricsView() {
  view = 'lyrics';
  lyricSeq++;                  // cancel a cover picture that hasn't been sent yet
  sendHeader();
  lastSentIdx = -2;            // lyric area gets redrawn on the next tick
}

function resendAll() {
  if (!current) {
    // Nothing playing yet: still wake the display so we know BLE works
    send('T', 'Bridge connected');
    sendLyric(store.get('access_token') ? 'Play a song on Spotify' : 'Log in to Spotify on phone', 'S');
    return;
  }
  if (view === 'card') sendCard();
  else { sendHeader(); lastSentIdx = -2; }   // force lyric resend on next tick
}

async function poll() {
  try {
    const tok = await accessToken();
    if (!tok) { $('spDot').classList.remove('on'); return; }
    const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { Authorization: 'Bearer ' + tok } });
    if (r.status === 429) { log('Rate limited by Spotify'); return; }
    if (r.status === 401) { store.set('expires_at', 0); return; }
    $('spDot').classList.add('on');
    if (r.status === 204) { if (playing) { playing = false; send('P', '1'); } return; }
    const d = await r.json();
    if (!d.item || d.currently_playing_type !== 'track') return;

    progressBase = d.progress_ms; progressAt = performance.now();
    if (d.is_playing !== playing) {
      playing = d.is_playing;
      if (current && current.id === d.item.id) {
        if (view === 'card') sendCard();
        else if (needsBitmap(current.title) || needsBitmap(current.artist)) sendHeader();
        else send('P', playing ? '0' : '1');
      }
    }

    if (!current || current.id !== d.item.id) {
      current = { id: d.item.id, title: d.item.name, artist: d.item.artists.map(a => a.name).join(', '), art: null };
      $('now').textContent = current.title; $('artist').textContent = current.artist; $('lyric').textContent = '…';
      log('Now playing: ' + current.title);
      lyrics = null; lastSentIdx = -2;
      const id = current.id;
      // Smallest cover that's at least 64 px (Spotify lists 640, 300, 64)
      const imgs = (d.item.album.images || []).slice().sort((a, b) => a.width - b.width);
      const artUrl = (imgs.find(i => i.width >= 64) || imgs[imgs.length - 1] || {}).url;
      const [art, l] = await Promise.all([loadArt(artUrl), fetchLyrics(d.item)]);
      if (!current || current.id !== id) return;
      current.art = art;
      lyrics = l; lastSentIdx = -2;
      if (userMode === 'cover') { cardUntil = Infinity; sendCard(); }
      else if (cardEnabled()) { cardUntil = performance.now() + CARD_MIN_MS; sendCard(); }
      else { view = 'lyrics'; sendHeader(); }
    }
  } catch (e) { log('poll: ' + e.message); }
}

function tick() {
  if (!current || !lyrics) return;
  if (view === 'card') {
    if (userMode === 'cover') return;           // button chose the cover: stay on it
    // Stay on the cover for no-lyric songs; otherwise switch just before the first line
    if (lyrics.status) { $('lyric').textContent = lyrics.status; return; }
    const p = progressBase + (playing ? performance.now() - progressAt : 0) + offsetMs;
    if (!lyrics.lines.length) return;
    if (performance.now() < cardUntil || lyrics.lines[0].t > p + bitmapLeadMs() + 1500) return;
    showLyricsView();
  }
  if (lyrics.status) {
    if (lastSentIdx !== -3) { sendLyric(lyrics.status, 'S'); $('lyric').textContent = lyrics.status; lastSentIdx = -3; }
    return;
  }
  const pos = progressBase + (playing ? performance.now() - progressAt : 0) + offsetMs;
  let idx = -1;
  for (let i = 0; i < lyrics.lines.length && lyrics.lines[i].t <= pos; i++) idx = i;
  // Tamil lines go as pictures and take ~0.8 s to send, so start them early
  const lead = pos + bitmapLeadMs();
  const next = lyrics.lines[idx + 1];
  if (next && needsBitmap(next.text) && next.t <= lead) idx++;

  // Long Tamil lines are split into screens shown evenly across the line's duration
  let screen = 0;
  const line = lyrics.lines[idx];
  if (line && needsBitmap(line.text)) {
    const n = lyricScreens(line.text).length;
    if (n > 1) {
      const end = lyrics.lines[idx + 1]?.t ?? line.t + 5000;
      screen = Math.max(0, Math.min(n - 1, Math.floor((lead - line.t) / ((end - line.t) / n))));
    }
  }

  const key = idx * 100 + screen;
  if (key !== lastSentIdx) {
    const sameLine = Math.floor(lastSentIdx / 100) === idx && lastSentIdx >= 0;
    lastSentIdx = key;
    const text = idx >= 0 ? lyrics.lines[idx].text : '';
    if (!sameLine) $('lyric').textContent = text || '\u266A';   // \u266A = instrumental gap
    sendLyric(text ? text : '~ ~ ~', 'L', screen);
  }
}

// Keep-alive so the display doesn't time out during long instrumental gaps
setInterval(() => { if (bleChar) send('P', playing ? '0' : '1'); }, KEEPALIVE_MS);

// Keep the phone awake; browsers throttle timers when the screen is off
async function keepAwake() {
  try { await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

// ================= boot =================
$('loginBtn').onclick = login;
$('bleBtn').onclick = connectBle;
$('viewBtn').onclick = toggleView;
$('viewBtn').textContent = userMode === 'cover' ? 'Show lyrics' : 'Show cover';
$('testBtn').onclick = () => {
  if (!bleChar) return log('Test: display not connected');
  send('T', 'Test OK'); send('A', 'Hello from phone');
  sendLyric('வணக்கம்! தமிழ் பாடல் வரிகள்', 'S');
  log('Test message sent');
};
if (!navigator.bluetooth) log('Web Bluetooth not available here. Use Chrome on Android (or Bluefy on iPhone).');

handleRedirect().catch(e => log(e.message)).finally(() => {
  keepAwake();
  poll(); setInterval(poll, POLL_MS);
  setInterval(tick, TICK_MS);
});
</script>
</body>
</html>
